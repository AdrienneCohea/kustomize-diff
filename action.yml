name: kustomize-diff
description: Diff Kustomize overlays between a PR branch and its merge target
author: AdrienneCohea

inputs:
  search-path:
    description: >
      Newline-separated list of paths (relative to repo root) to search for
      Kustomize overlays. If omitted, the entire repo is searched.
    required: false
  force-truecolor:
    description: >
      Force 24-bit true color output (implies force-color). Set to "true" to
      enable.
    required: false
    default: "false"
  red-green:
    description: >
      Use a red/green color palette instead of the default blue/orange/yellow
      one. dyff also renders +/-/± symbols alongside color, so output remains
      readable regardless of this setting.
    required: false
    default: "false"
  set-exit-code:
    description: >
      Exit with code 1 when differences are found, 0 when none. Fatal errors
      always exit 255. Set to "true" to enable.
    required: false
    default: "false"

runs:
  using: docker
  image: docker://ghcr.io/adriennecohea/kustomize-diff:v1

branding:
  icon: git-pull-request
  color: blue
