name: kustomize-diff
description: Diff Kustomize overlays between a PR branch and its merge target
author: AdrienneCohea

inputs:
  search-path:
    description: >
      Newline-separated list of paths (relative to repo root) to search for
      Kustomize overlays. If omitted, the entire repo is searched.
    required: false
  force-truecolor:
    description: >
      Force 24-bit true color output (implies force-color). Set to "true" to
      enable.
    required: false
    default: "false"
  accessible-colors:
    description: >
      Use a blue/orange color palette instead of the default red/green one.
      Recommended for users with red-green color vision deficiency (protanopia
      or deuteranopia). dyff also renders +/-/± symbols alongside color, so
      output remains readable regardless of this setting.
    required: false
    default: "false"

runs:
  using: docker
  image: docker://ghcr.io/adriennecohea/kustomize-diff:v1

branding:
  icon: git-pull-request
  color: blue
